<nav class="site-nav" aria-label="主导航">
    <a class="site-title" href="{{ site.Home.RelPermalink }}" aria-label="返回 {{ site.Title }} 首页">
        <span aria-hidden="true">&lt;</span>{{ site.Title }}<span aria-hidden="true">&gt;</span>
    </a>
    <ul>
        {{ $currentPage := . }}
        {{ range site.Menus.main }}
        <li>
            <a{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) (eq $currentPage.RelPermalink (.URL | relLangURL)) }} class="active" aria-current="page"{{ end }} href="{{ .URL | absLangURL }}">{{ lower .Name }}</a>
        </li>
        {{ end }}
    </ul>
</nav>
