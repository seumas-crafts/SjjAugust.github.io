baseURL = "https://seumas-crafts.github.io/SjjAugust.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "Seumas Blog"
theme = "risotto"
author = "Seumas"
copyright = "© Seumas"
enableInlineShortcodes = true
enableRobotsTXT = true
hasCJKLanguage = true
sectionPagesMenu = "main"

[pagination]
pagerSize = 10

[params]
noindex = false

[params.theme]
palette = "base16-dark"

[params.about]
title = "Seumas Blog"
description = "Notes, essays, and working thoughts."
logo = "✦"

[[params.socialLinks]]
icon = "fa-brands fa-github"
title = "GitHub"
url = "https://github.com/seumas-crafts/SjjAugust.github.io"

[[params.socialLinks]]
icon = "fa-solid fa-envelope"
title = "Email"
url = "mailto:hello@example.com"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true

[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true
  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true
  [privacy.instagram]
    disabled = false
    simple = true
  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]
  [services.instagram]
    disableInlineCSS = true
  [services.x]
    disableInlineCSS = true
